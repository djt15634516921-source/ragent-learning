<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ragent 知识库与文档</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 36px auto; padding: 0 20px; max-width: 900px; font: 16px/1.7 system-ui,sans-serif; color: #243047; background: #f6f8fc; }
    h1 { font-size: 26px; } h2 { font-size: 19px; margin-top: 0; }
    section { padding: 24px; margin: 20px 0; background: white; border: 1px solid #dde3ec; border-radius: 12px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input,textarea,select,button { font: inherit; }
    input,textarea,select { width: 100%; padding: 10px; border: 1px solid #bdc8d8; border-radius: 6px; }
    button { margin: 12px 8px 0 0; padding: 9px 17px; border: 0; border-radius: 6px; cursor: pointer; color: white; background: #285edb; }
    button.secondary { background: #e9eef8; color: #243047; }
    button:disabled { opacity: .5; cursor: default; }
    fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    .hint,[role=status] { color: #52627a; font-size: 14px; }
    ul { padding-left: 22px; } li { margin: 12px 0; overflow-wrap: anywhere; }
    a { color: #285edb; } .file-detail { display: block; color: #52627a; font-size: 14px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 480px; overflow: auto; font: inherit; }
  </style>
</head>
<body>
  <h1>知识库与文档</h1>
  <p><a href="/login-test.html">返回登录与聊天</a></p>
  <p id="identity" role="status">正在检查登录状态…</p>
  <fieldset id="workspace" disabled>
    <section>
      <h2>创建知识库</h2>
      <form id="create-form">
        <label for="name">名称</label><input id="name" required maxlength="100" placeholder="例如 Java 学习资料">
        <label for="description">说明</label><textarea id="description" maxlength="500" rows="2" placeholder="这份资料主要讲什么？"></textarea>
        <button type="submit">创建知识库</button>
      </form>
    </section>
    <section>
      <h2>上传文档</h2>
      <label for="knowledge-base">我的知识库</label>
      <select id="knowledge-base"><option value="">正在加载…</option></select>
      <button id="refresh" class="secondary" type="button">刷新列表</button>
      <form id="upload-form">
        <label for="file">选择文件</label>
        <input id="file" type="file" required accept=".txt,.md,.pdf,.docx">
        <p class="hint">支持 TXT、Markdown、文本型 PDF、DOCX，每个文件不超过 10 MB。上传后点击“解析文本”。</p>
        <button type="submit">上传到当前知识库</button>
      </form>
    </section>
    <section>
      <h2>当前知识库的文档</h2>
      <p id="empty">请选择知识库。</p>
      <ul id="documents"></ul>
    </section>
    <section>
      <h2>解析文本</h2>
      <p id="text-summary" class="hint">选择一份文档查看解析结果。</p>
      <pre id="parsed-text"></pre>
    </section>
  </fieldset>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="/auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let busy = false;
    async function read(response) {
      const data = await response.json();
      if (!response.ok) {
        if (response.status === 401) {
          $('identity').dataset.authenticated = 'false';
          $('workspace').disabled = true;
          $('identity').textContent = '请先返回聊天页登录，再刷新此页。';
        }
        throw new Error(`HTTP ${response.status} · ${data.code}: ${data.message}`);
      }
      return data;
    }
    async function get(url) {
      return read(await RagentAuth.fetch(url));
    }
    async function post(url, body, json = false) {
      const headers = json ? {'Content-Type': 'application/json'} : {};
      // FormData 的 Content-Type 和 boundary 由浏览器填写。
      return read(await RagentAuth.fetch(url, {method: 'POST', headers, body}));
    }
    async function run(action) {
      if (busy) return;
      busy = true;
      $('workspace').disabled = true;
      $('status').textContent = '正在处理…';
      try { await action(); }
      catch (error) { $('status').textContent = error.message; }
      finally {
        busy = false;
        $('workspace').disabled = $('identity').dataset.authenticated !== 'true';
      }
    }
    async function documents() {
      $('documents').replaceChildren();
      const id = $('knowledge-base').value;
      $('empty').textContent = id ? '正在加载文档…' : '先创建或选择一个知识库。';
      if (!id) return;
      const rows = await get(`/api/knowledge-bases/${id}/documents`);
      $('empty').textContent = rows.length ? '' : '这个知识库还没有文档。';
      for (const row of rows) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.textContent = row.filename;
        link.href = `/api/knowledge-bases/${id}/documents/${row.id}/file`;
        link.addEventListener('click', event => {
          event.preventDefault();
          run(async () => {
            const response = await RagentAuth.fetch(link.href);
            if (!response.ok) { await read(response); return; }
            const objectUrl = URL.createObjectURL(await response.blob());
            const download = document.createElement('a');
            download.href = objectUrl; download.download = row.filename;
            document.body.append(download); download.click(); download.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            $('status').textContent = '已下载：' + row.filename;
          });
        });
        const detail = document.createElement('span');
        detail.className = 'file-detail';
        const label = {PENDING: '待处理', RUNNING: '解析中', SUCCESS: '解析完成', FAILED: '解析失败'}[row.status] || row.status;
        detail.textContent = `${label} · ${(row.size / 1024).toFixed(1)} KB · 点击文件名下载原文件`;
        item.append(link, detail);
        if (row.errorMessage) {
          const failure = document.createElement('span');
          failure.className = 'file-detail';
          failure.textContent = row.errorMessage;
          item.append(failure);
        }
        const parse = document.createElement('button');
        parse.type = 'button';
        parse.className = 'secondary';
        parse.textContent = row.status === 'SUCCESS' ? '重新解析' : row.status === 'FAILED' ? '重试解析' : '解析文本';
        parse.addEventListener('click', () => run(async () => {
          $('text-summary').textContent = `正在解析：${row.filename}`;
          $('parsed-text').textContent = '';
          $('status').textContent = '正在提取文本，请稍候…';
          try {
            const result = await post(`/api/knowledge-bases/${id}/documents/${row.id}/parse`, '');
            showText(row.filename, result);
            $('status').textContent = `“${row.filename}”解析完成`;
          } catch (error) {
            $('text-summary').textContent = row.filename;
            $('parsed-text').textContent = error.message;
            throw error;
          } finally { await documents().catch(() => {}); }
        }));
        const preview = document.createElement('button');
        preview.type = 'button';
        preview.className = 'secondary';
        preview.textContent = '查看文本';
        preview.addEventListener('click', () => run(async () => {
          showText(row.filename, await get(`/api/knowledge-bases/${id}/documents/${row.id}/text`));
          $('status').textContent = '';
        }));
        item.append(parse, preview);
        $('documents').append(item);
      }
    }
    function showText(filename, result) {
      $('text-summary').textContent = `${filename} · ${result.characterCount} 字符`;
      $('parsed-text').textContent = result.status === 'SUCCESS' ? result.text
        : result.errorMessage || (result.status === 'RUNNING' ? '文档正在解析，请稍后刷新。' : '尚未解析，请点击“解析文本”。');
    }
    async function bases(selected = $('knowledge-base').value) {
      const rows = await get('/api/knowledge-bases');
      $('knowledge-base').replaceChildren();
      if (!rows.length) $('knowledge-base').append(new Option('请先创建知识库', ''));
      for (const row of rows) $('knowledge-base').append(new Option(row.name, String(row.id)));
      if (rows.some(row => String(row.id) === String(selected))) $('knowledge-base').value = String(selected);
      await documents();
    }
    $('create-form').addEventListener('submit', event => {
      event.preventDefault();
      run(async () => {
        const row = await post('/api/knowledge-bases', JSON.stringify({name: $('name').value, description: $('description').value}), true);
        await bases(row.id);
        $('create-form').reset();
        $('status').textContent = `已创建知识库“${row.name}”`;
      });
    });
    $('upload-form').addEventListener('submit', event => {
      event.preventDefault();
      run(async () => {
        const id = $('knowledge-base').value;
        const file = $('file').files[0];
        if (!id) throw new Error('请先创建或选择知识库');
        if (!file || !file.size) throw new Error('请选择一个非空文件');
        if (file.size > 10 * 1024 * 1024) throw new Error('单个文件不能超过 10 MB');
        const form = new FormData();
        form.append('file', file);
        const row = await post(`/api/knowledge-bases/${id}/documents`, form);
        await documents();
        $('upload-form').reset();
        $('status').textContent = `已上传“${row.filename}”，状态：待处理`;
      });
    });
    $('knowledge-base').addEventListener('change', () => run(async () => {
      $('text-summary').textContent = '选择一份文档查看解析结果。';
      $('parsed-text').textContent = '';
      await documents(); $('status').textContent = '';
    }));
    $('refresh').addEventListener('click', () => run(async () => { await bases(); $('status').textContent = '列表已刷新'; }));
    (async () => {
      try {
        const user = await get('/api/auth/me');
        $('identity').textContent = `已登录：${user.username}`;
        $('identity').dataset.authenticated = 'true';
        await bases();
        $('workspace').disabled = false;
      } catch (error) { $('status').textContent = error.message; }
    })();
  </script>
</body>
</html>
