<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ragent 登录与聊天</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 36px auto; padding: 0 20px; max-width: 880px; font: 16px/1.7 system-ui,sans-serif; color: #243047; background: #f6f8fc; }
    h1 { font-size: 26px; } h2 { font-size: 19px; margin-top: 0; }
    section { padding: 24px; margin: 20px 0; background: white; border: 1px solid #dde3ec; border-radius: 12px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input,textarea,select,button { font: inherit; }
    input,textarea,select { width: 100%; padding: 10px; border: 1px solid #bdc8d8; border-radius: 6px; }
    textarea { min-height: 110px; resize: vertical; }
    button { margin: 12px 8px 0 0; padding: 9px 17px; border: 0; border-radius: 6px; cursor: pointer; color: white; background: #285edb; }
    button.secondary { background: #e9eef8; color: #243047; }
    button:disabled { opacity: .5; cursor: default; }
    fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    .hint,[role=status] { color: #52627a; font-size: 14px; }
    #knowledge-mode-status { padding: 10px 12px; border-radius: 6px; background: #fff3d4; color: #624900; font-weight: 600; }
    #knowledge-mode-status[data-knowledge=true] { background: #edf4ff; color: #234d9a; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin-bottom: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width:600px) { .row { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <h1>Ragent 登录与聊天</h1>
  <p>登录自己的账号，继续自己的会话。</p>
  <p><a href="/knowledge-test.html">管理知识库与上传文档</a></p>
  <section>
    <h2>账号</h2>
    <form id="auth-form">
      <div class="row">
        <div><label for="username">用户名</label><input id="username" autocomplete="username" maxlength="32" required placeholder="例如 study_a"></div>
        <div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="至少 8 个字符"></div>
      </div>
      <button id="login" type="submit">登录</button>
      <button id="register" type="button" class="secondary">注册账号</button>
      <button id="logout" type="button" class="secondary" disabled>退出登录</button>
    </form>
    <p id="auth-status" role="status">正在检查登录状态…</p>
  </section>
  <section>
    <h2>会话</h2>
    <fieldset id="chat-fields" disabled>
      <label for="chat-knowledge-base">回答依据</label>
      <select id="chat-knowledge-base"><option value="">普通聊天</option></select>
      <p id="knowledge-mode-status" role="status">当前模式：普通聊天 · 未使用知识库</p>
      <p class="hint">选择知识库后只依据已向量化资料回答，并展示来源。切换知识库会新建会话。</p>
      <label for="saved-conversations">我的最近会话</label>
      <select id="saved-conversations"><option value="">请选择，或新建会话</option></select>
      <button id="new-conversation" type="button" class="secondary">新建会话</button>
      <button id="refresh-conversations" type="button" class="secondary">刷新列表</button>
      <button id="delete-conversation" type="button" class="secondary">删除当前会话</button>
      <form id="chat-form">
        <label for="conversation-id">会话编号</label>
        <input id="conversation-id" maxlength="128" required placeholder="新建后自动填写，也可以填写自己的旧会话编号">
        <button id="load-history" type="button" class="secondary">查看最近历史</button>
        <label for="question">本次问题</label>
        <textarea id="question" maxlength="8000" required>请记住：我的学习代号是朱之文01。</textarea>
        <label for="mode">回答方式</label>
        <select id="mode"><option value="stream">逐段显示</option><option value="normal">等待完整回答</option></select>
        <button id="send" type="submit">发送问题</button>
      </form>
    </fieldset>
    <button id="stop-generation" type="button" class="secondary" disabled>停止生成</button>
    <p class="hint">聊天历史会保存。服务重启后，未过期的登录仍有效。关闭当前标签页会清理本页登录凭证。</p>
  </section>
  <section><h2>本次回答</h2><div id="chat-status" role="status">请先登录</div><p id="retrieval-query" hidden></p><p id="retrieval-trace" hidden></p><pre id="answer"></pre><div id="sources"></div></section>
  <section><h2>聊天历史</h2><p class="hint">每次加载最多 20 条消息。页面可以翻看全部历史，模型仍只读取最近 6 轮。</p><pre id="history">尚未选择会话</pre><button id="older-history" type="button" class="secondary" disabled>加载更早消息</button></section>
  <script src="/auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let currentUser = null;
    let busy = false;
    let aborter = null;
    let activeStream = null;
    let stopRequested = false;
    let historyPage = {cid:'', messages:[], cursor:null};

    async function jsonResponse(response) {
      const data = await response.json();
      if (!response.ok) throw new Error(`HTTP ${response.status} · ${data.code}: ${data.message}`);
      return data;
    }
    async function getJson(url) {
      return jsonResponse(await RagentAuth.fetch(url));
    }
    async function post(url, body, contentType, extra = {}) {
      return RagentAuth.fetch(url, {
        method: 'POST', body, ...extra,
        headers: {'Content-Type': contentType, ...extra.headers}
      });
    }
    window.addEventListener('ragent-auth-expired', () => {
      if (aborter) aborter.abort();
      showUser(null);
      $('answer').textContent = ''; $('sources').replaceChildren(); showRetrievalQuery(null);
      $('history').textContent = '请重新登录';
      $('auth-status').textContent = '登录已失效，请重新登录';
    });
    function showUser(user) {
      currentUser = user;
      $('chat-fields').disabled = !user || busy;
      $('logout').disabled = !user;
      $('login').disabled = busy || !!user;
      $('register').disabled = busy || !!user;
      $('username').disabled = !!user;
      $('password').disabled = !!user;
      $('stop-generation').disabled = !user || !busy || !activeStream;
      $('auth-status').textContent = user ? `已登录：${user.username} · 用户编号 ${user.userId}` : '尚未登录';
      updateKnowledgeMode();
    }
    function updateKnowledgeMode() {
      const select = $('chat-knowledge-base');
      $('knowledge-mode-status').dataset.knowledge = String(!!select.value);
      $('knowledge-mode-status').textContent = select.value
        ? '当前模式：知识库问答 · ' + select.selectedOptions[0].textContent
        : '当前模式：普通聊天 · 未使用知识库';
      const deleted = select.selectedOptions[0]?.dataset.deleted === 'true';
      if (deleted) {
        $('knowledge-mode-status').textContent = '该知识库已删除，当前会话仅可查看历史；请新建会话并选择其他回答依据。';
        $('chat-status').textContent = '知识库已删除，当前会话仅可查看历史';
      }
      $('send').disabled = deleted;
    }
    function selectKnowledgeBase(id) {
      if (id && ![...$('chat-knowledge-base').options].some(option => option.value === id)) {
        const option = new Option('已删除的知识库（仅查看历史）', id); option.dataset.deleted = 'true';
        $('chat-knowledge-base').add(option);
      }
      $('chat-knowledge-base').value = id;
      updateKnowledgeMode();
    }
    function newConversation() {
      $('conversation-id').value = 'chat-' + crypto.randomUUID();
      $('saved-conversations').value = '';
      $('answer').textContent = ''; $('sources').replaceChildren(); showRetrievalQuery(null);
      $('history').textContent = '新会话，尚无消息';
      historyPage = {cid:'',messages:[],cursor:null}; $('older-history').disabled = true;
      $('chat-status').textContent = '可以发送问题';
      updateKnowledgeMode();
    }
    async function refreshConversations() {
      const items = await getJson('/api/conversations');
      const select = $('saved-conversations');
      select.replaceChildren(new Option('请选择，或新建会话', ''));
      for (const item of items) {
        const option = new Option(item.conversationId + (item.knowledgeBaseId ? ' · 知识库问答' : ' · 普通聊天'), item.conversationId);
        option.dataset.knowledgeBaseId = item.knowledgeBaseId == null ? '' : String(item.knowledgeBaseId);
        select.add(option);
      }
      select.value = items.some(x => x.conversationId === $('conversation-id').value) ? $('conversation-id').value : '';
    }
    async function refreshKnowledgeBases() {
      const selected = $('chat-knowledge-base').value;
      const items = await getJson('/api/knowledge-bases');
      $('chat-knowledge-base').replaceChildren(new Option('普通聊天', ''));
      for (const item of items) $('chat-knowledge-base').add(new Option(item.name, String(item.id)));
      if (selected) selectKnowledgeBase(selected);
      updateKnowledgeMode();
    }
    function showSources(sources = []) {
      $('sources').replaceChildren();
      sources.forEach((source, i) => {
        const item = document.createElement('details'), title = document.createElement('summary');
        title.textContent = '[' + (i + 1) + '] ' + source.filename + ' · 第 ' + (source.chunkIndex + 1) + ' 块 · 向量分 ' + source.score.toFixed(3)
          + (source.rerankScore == null ? '' : ' · 重排分 ' + source.rerankScore.toFixed(3));
        const text = document.createElement('pre'); text.textContent = source.content;
        item.append(title, text); $('sources').append(item);
      });
    }
    function showRetrievalQuery(query) {
      const display = $('retrieval-query');
      display.hidden = !query;
      if (!query) showRetrievalTrace(null);
      if (!query) { display.textContent = ''; return; }
      const labels = {SKIPPED: '首轮使用原问题', DISABLED: '使用原问题', UNCHANGED: '问题已明确',
        REWRITTEN: '已补全追问对象', AMBIGUOUS: '需要明确追问对象',
        FALLBACK_TIMEOUT: '补全超时，使用原问题', FALLBACK_ERROR: '补全暂不可用，使用原问题'};
      display.textContent = (labels[query.status] || '本次检索') + ' · 用于检索的问题：' + query.searchQuestion;
    }
    function showRetrievalTrace(trace) {
      const display = $('retrieval-trace'); display.hidden = !trace;
      if (!trace) { display.textContent = ''; return; }
      const labels = {APPLIED:'重排已应用',DISABLED:'未开启重排',SKIPPED_EMPTY:'无候选，跳过重排',SKIPPED_BUDGET:'重排超出预算，保留向量排序',
        FALLBACK_TIMEOUT:'重排超时，已回退',FALLBACK_ERROR:'重排失败，已回退',FALLBACK_NOT_CONFIGURED:'重排未配置，保留向量排序'};
      display.textContent = (labels[trace.rerankStatus] || trace.rerankStatus) + ` · 召回 ${trace.recalledCount} → 候选 ${trace.candidateCount} → 采用 ${trace.returnedCount}`
        + ` · 重排 ${trace.rerankMs}ms` + (trace.errorCode ? ' · ' + trace.errorCode : '');
    }
    async function loadHistory(older = false) {
      const cid = $('conversation-id').value.trim();
      if (!cid) throw new Error('请先填写会话编号');
      if (older && (historyPage.cid !== cid || !historyPage.cursor)) return;
      const cursor = older ? '&beforeId=' + historyPage.cursor : '';
      const page = await getJson('/api/conversations/' + encodeURIComponent(cid) + '/messages/page?size=20' + cursor);
      if (cid !== $('conversation-id').value.trim()) return;
      historyPage = {cid, messages:older ? [...page.messages,...historyPage.messages] : page.messages, cursor:page.nextBeforeId};
      $('history').textContent = historyPage.messages.length ? historyPage.messages.map(m => `${m.role === 'user' ? '我' : '助手'}：${m.content}${m.sources?.length ? '\n来源：' + m.sources.map((x, i) => '[' + (i+1) + '] ' + x.filename + ' 第' + (x.chunkIndex+1) + '块').join('；') : ''}`).join('\n\n') : '尚无成功保存的消息';
      $('older-history').disabled = !page.hasMore;
    }
    $('older-history').addEventListener('click', async () => {
      $('older-history').disabled = true;
      try { await loadHistory(true); } catch (error) { $('chat-status').textContent = error.message; $('older-history').disabled = !historyPage.cursor; }
    });
    $('delete-conversation').addEventListener('click', async () => {
      const cid = $('conversation-id').value.trim();
      if (!cid || !confirm('删除当前会话及全部消息？该操作无法恢复。')) return;
      try {
        await jsonResponse(await RagentAuth.fetch('/api/conversations/' + encodeURIComponent(cid), {method:'DELETE'}));
        newConversation(); await refreshConversations(); $('chat-status').textContent = '会话和消息已删除';
      } catch (error) { $('chat-status').textContent = error.message; }
    });
    $('stop-generation').addEventListener('click', async () => {
      const stream = activeStream;
      if (!stream) return;
      stopRequested = true;
      $('stop-generation').disabled = true;
      try {
        const result = await jsonResponse(await post('/api/conversations/' + encodeURIComponent(stream.cid) + '/streams/' + stream.id + '/cancel', '', 'application/json'));
        if (result.cancelled) aborter?.abort();
        $('chat-status').textContent = result.cancelled ? '已停止生成，未保存中断回答。'
          : result.status === 'COMPLETED' ? '回答已完成并保存，请查看历史。' : '任务已结束，请查看历史确认保存结果。';
        await loadHistory();
      } catch (error) { $('chat-status').textContent = '停止请求未确认：' + error.message; }
    });
    $('auth-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (currentUser || busy) return;
      $('login').disabled = $('register').disabled = true;
      $('auth-status').textContent = '正在登录…';
      try {
        const data = JSON.stringify({username: $('username').value, password: $('password').value});
        const user = await jsonResponse(await post('/api/auth/login', data, 'application/json'));
        RagentAuth.set(user.token);
        $('password').value = '';
        showUser(user);
        newConversation();
        await Promise.all([refreshConversations(), refreshKnowledgeBases()]);
      } catch (error) {
        showUser(currentUser);
        $('auth-status').textContent = error.message;
      }
    });
    $('register').addEventListener('click', async () => {
      if (currentUser || busy) return;
      $('login').disabled = $('register').disabled = true;
      try {
        const user = await jsonResponse(await post('/api/auth/register', JSON.stringify({username: $('username').value, password: $('password').value}), 'application/json'));
        $('username').value = user.username;
        $('auth-status').textContent = `账号 ${user.username} 已创建，请点击登录`;
      } catch (error) { $('auth-status').textContent = error.message; }
      finally { $('login').disabled = $('register').disabled = false; }
    });
    $('logout').addEventListener('click', async () => {
      if (aborter) aborter.abort();
      try {
        await jsonResponse(await post('/api/auth/logout', '', 'application/json'));
        RagentAuth.clear();
        showUser(null);
        $('answer').textContent = $('conversation-id').value = '';
        $('sources').replaceChildren();
        showRetrievalQuery(null);
        $('chat-knowledge-base').replaceChildren(new Option('普通聊天', ''));
        $('history').textContent = '尚未选择会话';
        $('saved-conversations').replaceChildren(new Option('请选择，或新建会话', ''));
        $('chat-status').textContent = '已退出，请重新登录';
      } catch (error) { $('auth-status').textContent = error.message; }
    });
    $('new-conversation').addEventListener('click', newConversation);
    $('chat-knowledge-base').addEventListener('change', newConversation);
    $('refresh-conversations').addEventListener('click', () => Promise.all([refreshConversations(), refreshKnowledgeBases()]).catch(error => $('chat-status').textContent = error.message));
    $('load-history').addEventListener('click', () => loadHistory().catch(error => $('chat-status').textContent = error.message));
    $('saved-conversations').addEventListener('change', () => {
      if (!$('saved-conversations').value) return;
      $('conversation-id').value = $('saved-conversations').value;
      selectKnowledgeBase($('saved-conversations').selectedOptions[0].dataset.knowledgeBaseId);
      updateKnowledgeMode();
      $('answer').textContent = '';
      $('sources').replaceChildren(); showRetrievalQuery(null);
      loadHistory().catch(error => $('chat-status').textContent = error.message);
    });
    function createSseReader(onEvent) {
      let buffer = '';
      return text => {
        buffer = (buffer + text).replace(/\r\n/g, '\n');
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const frame = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
          let name = 'message'; const data = [];
          for (const line of frame.split('\n')) {
            if (line.startsWith('event:')) name = line.slice(6).trim();
            if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
          }
          if (data.length) onEvent(name, JSON.parse(data.join('\n')));
        }
      };
    }
    $('chat-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!currentUser || busy) return;
      busy = true; activeStream = null; stopRequested = false; showUser(currentUser); aborter = new AbortController();
      $('answer').textContent = ''; $('sources').replaceChildren(); showRetrievalQuery(null); $('chat-status').textContent = '正在连接…';
      const started = performance.now(); let reader; let completed = false; let terminal = false; let chunks = 0;
      let answerBasis = '';
      const basis = data => data.knowledgeBaseId == null ? '普通聊天 · 未使用知识库'
        : '知识库问答 · 使用 ' + (data.sources || []).length + ' 个资料片段';
      try {
        const streaming = $('mode').value === 'stream';
        const response = await post(streaming ? '/api/chat/stream' : '/api/chat', JSON.stringify({
          conversationId: $('conversation-id').value, question: $('question').value,
          knowledgeBaseId: $('chat-knowledge-base').value ? Number($('chat-knowledge-base').value) : null
        }), 'application/json', {signal: aborter.signal, headers: {'Accept': streaming ? 'text/event-stream' : 'application/json'}});
        if (!streaming || !response.ok) {
          const data = await jsonResponse(response);
          $('answer').textContent = data.answer; showSources(data.sources); showRetrievalQuery(data.retrievalQuery); showRetrievalTrace(data.retrieval); answerBasis = basis(data); completed = terminal = true;
        } else {
          if (!response.headers.get('content-type')?.includes('text/event-stream')) throw new Error('接口没有返回流式回答');
          const feed = createSseReader((name, data) => {
            if (name === 'start') { activeStream = {cid:data.conversationId,id:data.streamId}; $('stop-generation').disabled = !data.streamId; $('chat-status').textContent = '正在准备回答…'; }
            if (name === 'delta') { chunks++; $('answer').textContent += data.content; $('chat-status').textContent = `接收中 · ${chunks} 个片段`; }
            if (name === 'done') { completed = terminal = true; $('answer').textContent = data.answer; showSources(data.sources); showRetrievalQuery(data.retrievalQuery); showRetrievalTrace(data.retrieval); answerBasis = basis(data); }
            if (name === 'error') { terminal = true; $('chat-status').textContent = `失败 · ${data.code}: ${data.message}`; }
          });
          reader = response.body.getReader(); const decoder = new TextDecoder('utf-8');
          while (true) {
            const {value, done} = await reader.read();
            if (done) { feed(decoder.decode()); break; }
            feed(decoder.decode(value, {stream: true}));
          }
        }
        if (completed) {
          $('chat-status').textContent = `回答已完成并保存 · ${answerBasis} · ${((performance.now() - started) / 1000).toFixed(2)} 秒`;
          if (currentUser) await Promise.all([refreshConversations(), loadHistory()]);
        } else if (!terminal && !stopRequested) $('chat-status').textContent = '连接已结束，保存结果尚未确认，请查看历史后再决定是否重试。';
      } catch (error) { if (!(stopRequested && error.name === 'AbortError')) $('chat-status').textContent = error.name === 'AbortError' ? '已停止接收，请查看历史确认保存情况。' : error.message; }
      finally { if (reader) reader.releaseLock(); busy = false; aborter = null; activeStream = null; showUser(currentUser); }
    });
    (async () => {
      try {
        const response = await RagentAuth.fetch('/api/auth/me');
        if (response.status === 401) { showUser(null); return; }
        showUser(await jsonResponse(response)); newConversation(); await Promise.all([refreshConversations(), refreshKnowledgeBases()]);
      } catch (error) { showUser(null); $('auth-status').textContent = error.message; }
    })();
  </script>
</body>
</html>
